name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌘⇧4 and capture an area
        2. Open the panel with ⇧⌘Space
        3. ...
  - type: input
    id: app-version
    attributes:
      label: Boardshot version
      description: Settings… → Updates shows it
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.4"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac chip
      options: [Apple Silicon (M1/M2/…), Intel, Not sure]
    validations:
      required: true
